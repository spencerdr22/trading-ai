default:
  symbol: MES
  model:
    window: 30
    features:
      ema_short: 12
      ema_long: 26
      rsi: 14
      atr: 14
    use_pytorch: false
  risk:
    # MES contract specs: tick size = 0.25 points, tick value = $1.25
    # 1 point = 4 ticks = $5.00 for MES
    stop_loss_ticks: 8       # 8 ticks = 2 points = $10 per contract
    take_profit_ticks: 16    # 16 ticks = 4 points = $20 per contract (2:1 R/R)
    tick_size: 0.25          # MES minimum tick
    tick_value: 1.25         # $ per tick for MES (ES is $12.50)
    point_value: 5.0         # $ per full point for MES (ES is $50)
    contract_cost: 1.25      # approx commission per side
    max_contracts: 10        # micro contracts - can trade more than ES
    risk_per_trade_pct: 0.01 # 1% account risk per trade
    max_drawdown_pct: 0.2
    daily_loss_limit: 0.05
  training:
    epochs: 5
    batch_size: 256
  simulator:
    volatility: 0.0008
    seed: 42
    fast_bar_seconds: 0.5
# Validation settings
validation:
  walk_forward:
    n_splits: 5
    mode: anchored
    test_size: null
  
  monte_carlo:
    n_sequences: 1000
    block_size: 20
    percentiles: [5, 25, 50, 75, 95]
  
  vectorbt:
    initial_cash: 10000.0
    fees: 0.001
    slippage: 0.0005